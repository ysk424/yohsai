schema_version = "1.0.0"

id = "yohsai"
version = "0.14.4"
name = "Yohsai"
tagline = "Experimental clothing construction tools"
maintainer = "Yoshihiko Tsukamoto"
type = "add-on"

blender_version_min = "5.2.0"
platforms = ["windows-x64"]

license = ["SPDX:GPL-3.0-or-later"]

tags = ["Modeling", "Pipeline"]

wheels = [
    "./wheels/pypdf-6.14.2-py3-none-any.whl",
]

[permissions]
files = "Load pattern PDF and write Yohsai JSON"
network = "Configure ZOZO Contact Solver through its localhost MCP server"

[build]
paths = [
    "__init__.py",
    "ui.py",
    "i18n.py",
    "kitsuke.py",
    "ppf_zero_gravity.py",
    "ppf_driver.py",
    "ppf_remesh.py",
    "ppf_clear.py",
    "zozo_handoff.py",
    "zozo_mcp_client.py",
    "shell_isect_bridge.py",
    "mesh_loader.py",
    "yohsai_svg_parser.py",
    "SVG_TO_JSON_SPEC.md",
    "KITSUKE_DESIGN.md",
    "PPF_ZERO_GRAVITY_DESIGN.md",
    "ZOZO_HANDOFF_DESIGN.md",
    "GRAINLINE_DESIGN.md",
    "SEAM_BOUNDARY_LAYER_DESIGN.md",
    "THIRD_PARTY_NOTICES.md",
    "README.md",
    "DEVELOPMENT_NOTES.md",
    "UTIL/silhouette_export.py",
    "UTIL/README.md",
    "LICENSE",
    "bin/vcomp140.dll",
    "bin/shell_isect.dll",
    "bin/SHELL_ISECT_README.txt",
]
