schema_version = "1.0.0"

id = "yohsai"
version = "0.12.2-ppf"
name = "Yohsai"
tagline = "Experimental clothing construction tools"
maintainer = "Yohsai Developers"
type = "add-on"

blender_version_min = "5.1.0"
platforms = ["windows-x64"]

license = ["SPDX:GPL-3.0-or-later"]

tags = ["Modeling", "Pipeline"]

wheels = [
    "./wheels/pypdf-6.14.2-py3-none-any.whl",
]

[permissions]
files = "Load pattern PDF and write Yohsai JSON"
network = "Configure ZOZO Contact Solver through its localhost MCP server"

[build]
paths = [
    "__init__.py",
    "CMakeLists.txt",
    "build_native.ps1",
    "ui.py",
    "i18n.py",
    "kitsuke.py",
    "ppf_zero_gravity.py",
    "ppf_driver.py",
    "zozo_handoff.py",
    "zozo_mcp_client.py",
    "shell_isect_bridge.py",
    "native_solver.py",
    "mesh_loader.py",
    "yohsai_svg_parser.py",
    "SVG_TO_JSON_SPEC.md",
    "KITSUKE_DESIGN.md",
    "SOLVER_DESIGN.md",
    "GRAINLINE_DESIGN.md",
    "SEAM_BOUNDARY_LAYER_DESIGN.md",
    "THIRD_PARTY_NOTICES.md",
    "DESIGN_PHILOSOPHY.md",
    "README.md",
    "DEVELOPMENT_NOTES.md",
    "UTIL/silhouette_export.py",
    "UTIL/README.md",
    "LICENSE",
    "bin/yohsai_solver.dll",
    "bin/vcomp140.dll",
    "bin/shell_isect.dll",
    "bin/SHELL_ISECT_README.txt",
    "native/CMakeLists.txt",
    "native/include/yohsai_solver/c_api.h",
    "native/src/math.hpp",
    "native/src/body_bvh.hpp",
    "native/src/material_cuda.hpp",
    "native/src/material_cuda.cu",
    "native/src/body_contact_cuda.hpp",
    "native/src/body_contact_cuda.cu",
    "native/src/solver.hpp",
    "native/src/solver.cpp",
    "native/src/c_api.cpp",
]
